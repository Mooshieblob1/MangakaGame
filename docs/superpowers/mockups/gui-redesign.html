<script>
(()=>{
const root=document.getElementById('mangaka-gui-review'),main=root.querySelector('#ms-main');
const helper=root.querySelector('#ms-helper-asset').src,office=root.querySelector('#ms-office-asset').src;
const initial={page:'office',theme:'dark',density:'comfortable',text:'14',motion:'subtle',speed:0,title:'lantern',side:'',cash:248000,reserved:20,pending:0,qty:50,tier:'copy',read:false,helperShown:false};let state={...initial};
function restore(saved){const p=saved?.privateContent;if(!p)return;for(const key of ['theme','density','text','motion','title','page'])if(typeof p[key]==='string')state[key]=p[key];if(!['office','series','studios','print','inbox','properties','event','helper'].includes(state.page))state.page='office';if(!['lantern','sky'].includes(state.title))state.title='lantern';if(!['14','16'].includes(state.text))state.text='14';}
restore(window.openai?.widgetState);
function persist(){window.openai?.setWidgetState?.({modelContent:{preview:'Mangaka GUI 9',page:state.page,theme:state.theme,density:state.density,text:state.text},privateContent:{page:state.page,theme:state.theme,density:state.density,text:state.text,motion:state.motion,title:state.title}})?.catch(()=>{});}
const money=n=>'¥'+n.toLocaleString('en-US');const button=(text,action,primary=false)=>`<button class="${primary?'ms-primary':''}" data-action="${action}">${text}</button>`;
function portrait(){return `<div class="ms-portrait"><img src="${helper}" alt="Helper-Chan, blonde twintails and glasses"></div>`;}
function tip(){return `<div class="ms-helper">${portrait()}<div><strong>Helper-Chan <small>· Your next step</small></strong><p>Paper Lantern, Issue 1 is ready. A small print run can help you prepare for Sunday's convention.</p><div class="ms-row">${button('Show me','print',true)}${button('Important message preview','helper')}</div></div></div>`;}
function heading(kicker,title,description,actions=''){return `<div class="ms-title"><div><div class="ms-eyebrow">${kicker}</div><h1>${title}</h1><p>${description}</p></div>${actions}</div>`;}
function officeArt(){return `<div class="ms-office"><svg viewBox="16 205 1568 569" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Existing chibi office development preview"><image href="${office}" width="1600" height="900"/><rect x="16" y="205" width="430" height="48" fill="#334148"/></svg><div class="ms-office-label">Parents' home · Nerima</div><div class="ms-office-note">Existing office preview image</div></div>`;}
function inboxCards(){return `<div class="ms-shelf"><span class="ms-eyebrow">Needs attention · 1</span><article class="ms-message"><div class="ms-row ms-between"><strong>Skybound: publisher offer</strong><span class="ms-badge ms-amber">Decision needed</span></div><p class="ms-muted">A serialization offer is ready to review. No contract has been signed.</p>${button('Review with Helper-Chan','helper',true)}</article><span class="ms-eyebrow">Results & milestones</span><article class="ms-message"><strong>Paper Lantern found its first readers</strong><p class="ms-muted">24 copies sold: 18 printed copies and 6 downloads.</p>${button('Open series','series')}</article><span class="ms-eyebrow">Routine updates</span><article class="ms-message"><strong>Sunday convention · booking confirmed</strong><p class="ms-muted">${state.reserved} copies reserved. ${32-state.reserved} remain available for other sales.</p>${button('Manage reservation','event')}</article></div>`;}
function officePage(){let side='';if(state.side==='series')side=`<aside class="ms-office-side"><div class="ms-row ms-between"><h3>Series at a glance</h3>${button('Close','close-side')}</div><strong>${state.title==='sky'?'Skybound':'Paper Lantern'}</strong><span class="ms-badge">${state.title==='sky'?'Offer received':'Issue 2 in production'}</span><p class="ms-muted">${state.title==='sky'?'Review the offer before accepting serialization.':'Pencils: 68%. Issue 1 is ready to print.'}</p>${button('Manage series','series',true)}</aside>`;if(state.side==='inbox')side=`<aside class="ms-office-side"><div class="ms-row ms-between"><h3>Inbox</h3>${button('Close','close-side')}</div><strong>Skybound: offer received</strong><p class="ms-muted">One decision needs your attention.</p>${button('Review offer','helper',true)}${button('All messages','inbox-page')}</aside>`;
return `${heading('Your working day','A little room. Big stories.','Your team is working on the next issue.',`<div class="ms-row">${button('Series sidebar','series-side')}${button('Inbox sidebar','inbox')}</div>`)}<div class="ms-stack"><div class="ms-office-layout ${side?'ms-has-side':''}">${officeArt()}${side}</div><div class="ms-row ms-between"><span class="ms-muted">Office controls stay familiar: WASD / drag to pan · wheel to zoom</span>${button('Manage this studio','studios')}</div>${tip()}</div>`;}
function seriesPage(){const sky=state.title==='sky';return `${heading('Series / Overview',sky?'Skybound':'Paper Lantern',sky?'Adventure · One-shot · Lead: your mangaka':'Slice of life · Ongoing doujin · Lead: your mangaka',button('Back to office','office'))}<div class="ms-stack"><div class="ms-card ms-row" style="align-items:center;gap:24px"><div class="ms-cover" aria-label="Illustrative cover design"><span class="ms-cover-top">AN ORIGINAL MANGA</span><span>${sky?'SKY<br>BOUND':'PAPER<br>LANTERN'}</span><small>${sky?'ONE-SHOT':'ISSUE 01'}</small></div><div class="ms-grow ms-stack"><div><span class="ms-badge">${sky?'Offer received · Not signed':'Self-published · Local & online'}</span><h2 style="margin-top:12px">${sky?'Your next chapter starts here.':'One issue out. Another on the drawing board.'}</h2><p class="ms-muted" style="margin-top:8px">${sky?'The pitch was accepted. Review the proposed terms before committing.':'Issue 1 can keep selling while the team draws Issue 2. Collected editions become available after five chapters.'}</p></div><div class="ms-row">${button(sky?'Review publisher offer':'Print Issue 1',sky?'helper':'print',true)}${button('View sales & stock','sales')}</div></div></div><div class="ms-lifecycle" aria-label="Series workflow"><button data-action="production"><small>01 · PRODUCTION</small><strong>${sky?'Manuscript complete':'Issue 2 · Pencils 68%'}</strong></button><button data-action="${sky?'helper':'print'}"><small>02 · RELEASE</small><strong>${sky?'Offer ready to review':'Issue 1 · Ready to print'}</strong></button><button data-action="sales"><small>03 · READERS</small><strong>${sky?'Not released yet':'24 sales · 186 fans'}</strong></button></div><div class="ms-grid"><section class="ms-card" id="ms-production"><div class="ms-row ms-between"><h2>${sky?'One-shot production':'Issue 2 production'}</h2><small>${sky?'Complete':'No publisher deadline'}</small></div><div class="ms-stages">${['Storyboard','Pencils','Inks','Backgrounds','Tones'].map((name,i)=>`<div class="ms-stage ${!sky&&i===1?'ms-active':''}"><span>${i+1}. ${name}</span><span>${sky||i===0?'Complete':i===1?'68%':'Queued'}</span></div>`).join('')}</div></section><section class="ms-card ms-stack" id="ms-sales"><h2>Sales & distribution</h2><dl><dt>Physical copies sold</dt><dd>${sky?0:18}</dd><dt>Downloads sold</dt><dd>${sky?0:6}</dd><dt>In stock</dt><dd>${sky?0:32}</dd><dt>Reserved for Sunday</dt><dd>${sky?0:state.reserved}</dd><dt>Available to other buyers</dt><dd>${sky?0:32-state.reserved}</dd><dt>Awaiting print delivery</dt><dd>${sky?0:state.pending}</dd></dl>${sky?'<p class="ms-muted">No editions have been released.</p>':`<span class="ms-badge">Online listing active · No upfront fee</span>${button('Convention reservation','event')}`}<details><summary>Advanced production settings</summary><p class="ms-muted">Pipeline: 2 chapters · Finished buffer: 2 · Short numbered issues enabled.</p></details></section></div></div>`;}
function plan(){return `<div class="ms-plan" role="img" aria-label="Illustrative floor plan: two workspaces with a break area"><div class="ms-desk">Drawing<br>desk</div><div class="ms-desk">Assistant<br>desk</div><div class="ms-desk" style="grid-column:1/-1;border-color:var(--ms-warm)">Shared break room</div><span class="ms-door"></span></div>`;}
function studiosPage(){return `${heading('Spaces for your stories','Your studios','One home base. Plenty of room to grow.',button('Compare properties','properties',true))}<div class="ms-stack"><div class="ms-metrics"><div class="ms-metric"><small>MONTHLY RENT</small><b class="ms-num">¥0</b><small>Parents' home</small></div><div class="ms-metric"><small>EQUIPPED WORKSPACES</small><b class="ms-num">1 / 2 occupied</b><small>Helper-Chan has her own desk</small></div><div class="ms-metric"><small>AVAILABLE BUSINESS CASH</small><b class="ms-num">${money(state.cash)}</b><small>After reserved wages</small></div></div><div class="ms-grid"><article class="ms-card ms-stack"><div class="ms-row ms-between"><h2>Parents' home</h2><span class="ms-badge">Main studio</span></div><span class="ms-muted">Nerima · Family home</span>${plan()}<dl><dt>Monthly rent</dt><dd>¥0</dd><dt>Team / usable desks</dt><dd>1 / 2</dd><dt>Printed stock / storage</dt><dd>32 / 200</dd></dl><div class="ms-row">${button('View office','office',true)}${button('Furnish','furnish')}</div></article><article class="ms-card ms-stack" style="align-content:start"><div class="ms-eyebrow">Your next space</div><h2>Find somewhere to grow.</h2><p class="ms-muted">Compare rent, move-in costs, desk capacity and storage before committing.</p>${button('Explore available properties','properties')}<hr><h3>Additional studios</h3><p class="ms-muted">Your first branch requires six staff and two active series.</p><span class="ms-badge ms-amber">Not eligible yet · 1 of 6 staff</span><small>Browse locations now. Opening a preview never spends money.</small></article></div>${tip()}</div>`;}
function propertiesPage(){return `${heading('Studios / Compare','Make space for the next chapter.','Illustrative property quotes for layout review.',button('Back to studios','studios'))}<div class="ms-grid">${[{name:'Nerima workroom',desks:4,rent:65000,storage:400},{name:'Nakano shared office',desks:4,rent:85000,storage:300}].map(p=>`<article class="ms-card ms-stack"><span class="ms-badge">Tier 1 · Sample property</span><h2>${p.name}</h2>${plan()}<dl><dt>Monthly rent</dt><dd>${money(p.rent)}</dd><dt>Deposit + first rent</dt><dd>${money(p.rent*3)}</dd><dt>Desk capacity</dt><dd>${p.desks}</dd><dt>Copy storage</dt><dd>${p.storage}</dd></dl><small>Moving and furniture are additional. Actual game quotes are unchanged.</small>${button('Inspect move preview','property-preview')}</article>`).join('')}</div>`;}
function printPage(){return `${heading('Books / Print order','Give your story a place on the table.','Paper Lantern · Issue 1 · 24 pages',button('Back to series','series'))}<div class="ms-grid"><section class="ms-card"><section id="ms-print-form" class="ms-form" role="form" aria-label="Sample print order"><span class="ms-badge">Print-ready master available</span><label>Printer<select id="ms-printer"><option value="copy">7-Twelve copy shop · 1 day</option><option value="local">Local printer · 4 days</option><option value="bulk">Bulk printer · 7 days</option></select></label><label>Copies<input id="ms-quantity" type="number" min="1" max="5000" step="1" value="${state.qty}" required></label><div><small>Sample quotes for design review. The game will use its existing pricing rules.</small></div><div id="ms-print-error" class="ms-error" role="alert"></div><button type="button" data-action="submit-print" class="ms-primary">Place sample print order</button><details><summary>Automatic reprint settings</summary><p class="ms-muted">Off for this sample. The game will let you set a stock target, allowed printers, and spending budget here.</p></details></section></section><aside class="ms-card ms-quote"><h2>Your print quote</h2><dl><dt>Edition</dt><dd>Issue 1</dd><dt>Copies</dt><dd id="ms-quote-qty"></dd><dt>Expected arrival</dt><dd id="ms-quote-arrival"></dd><dt>Available business cash</dt><dd>${money(state.cash)}</dd></dl><hr><div class="ms-total"><span>Total</span><strong id="ms-quote-total"></strong></div><small id="ms-after-cash"></small><hr><h3>What happens next?</h3><p class="ms-muted">Payment comes from business funds. Stock arrives after printing, then local sales begin automatically.</p>${button('Reserve existing copies for Sunday','event')}<p class="ms-muted">Online edition already listed. Download sales require no printing.</p></aside></div>`;}
function eventPage(){return `${heading('Books / Convention','Your table is booked.','Neighbourhood convention · Sunday 21 April · Walkable',button('Back to series','series'))}<div class="ms-grid"><section class="ms-card ms-stack"><h2>Keep copies for your readers</h2><dl><dt>Attendee</dt><dd>Your mangaka</dd><dt>Booth / travel</dt><dd>Free / free</dd><dt>Delivered stock</dt><dd>32 copies</dd></dl><section id="ms-reserve-form" class="ms-form" role="form" aria-label="Sample convention reservation"><label>Copies reserved for this booking<input id="ms-reserve-input" type="number" min="0" max="32" step="1" value="${state.reserved}" required></label><div class="ms-error" id="ms-reserve-error" role="alert"></div><button type="button" data-action="submit-reserve" class="ms-primary">Update sample reservation</button></section></section><aside class="ms-card ms-stack" style="align-content:start"><span class="ms-badge">Booking confirmed</span><h2>Set aside, not sold.</h2><p class="ms-muted">Reserved copies remain in stock but are protected from other sales. Unsold copies become available again after the event.</p><p class="ms-muted">Only delivered stock is used in this prototype. The game also supports eligible print deliveries due before the event.</p></aside></div>`;}
function helperPage(){return `${heading('Inbox / Decision','A publisher wants to hear from you.','Skybound · Offer received',button('Back to inbox','inbox-page'))}<section class="ms-dialog" aria-label="Helper-Chan important notification"><div class="ms-dialog-art"><img src="${helper}" alt="Helper-Chan holding her clipboard"></div><div class="ms-stack" style="align-content:start"><div><span class="ms-eyebrow">Helper-Chan</span><h2>They liked your one-shot!</h2></div><p>There's a serialization offer for Skybound. Let's look through the terms before we commit.</p><div class="ms-letter"><strong>Offer received ≠ contract signed</strong><span class="ms-muted">Accepting will begin publisher commitments. Reading this message does not accept the offer.</span></div><div class="ms-row">${button('Review terms','terms',true)}${button('Keep in inbox','defer')}</div><small>Sample message · Existing pause preferences apply in the game.</small></div></section>`;}
const pages={office:officePage,series:seriesPage,studios:studiosPage,properties:propertiesPage,print:printPage,event:eventPage,helper:helperPage,inbox:()=>heading('Your studio inbox','The things that need you.','One unresolved decision. Reading it does not resolve it.',button('Mark updates read','mark-read'))+inboxCards()};
function settings(){root.dataset.theme=state.theme;root.dataset.density=state.density;root.dataset.motion=state.motion;root.style.fontSize=state.text+'px';root.querySelectorAll('[data-setting]').forEach(e=>e.value=state[e.dataset.setting]);}
function quote(){const rates={copy:160,local:135,bulk:110},setup={copy:0,local:2500,bulk:6000};return Math.round(state.qty*rates[state.tier]+setup[state.tier]);}
function updateQuote(){const total=quote();root.querySelector('#ms-quote-qty').textContent=Number.isFinite(state.qty)?state.qty:'—';root.querySelector('#ms-quote-arrival').textContent={copy:'Tue 16 April',local:'Fri 19 April',bulk:'Mon 22 April'}[state.tier];root.querySelector('#ms-quote-total').textContent=Number.isFinite(total)?money(total):'—';root.querySelector('#ms-after-cash').textContent=Number.isFinite(total)?'Business funds after order: '+money(state.cash-total):'Enter a quantity.';}
function render(){settings();root.querySelector('#ms-title-choice').value=state.title;const sky=state.title==='sky';root.querySelector('#ms-progress-name').textContent=sky?'One-shot · Manuscript complete':'Issue 2 · Pencils';root.querySelector('#ms-progress-fill').style.width=sky?'100%':'68%';root.querySelector('#ms-progress-label').textContent=sky?'100% · 5 of 5 stages':'68% · Stage 2 of 5';root.querySelector('.ms-meter').setAttribute('aria-valuenow',sky?'100':'68');root.querySelector('#ms-publishing').textContent=sky?'Offer received':'Self-published';root.querySelector('#ms-sold').textContent=sky?'0':'24';root.querySelector('#ms-reserved').textContent=sky?'0':state.reserved;root.querySelector('#ms-reserved').parentElement.previousElementSibling.querySelector('b').textContent=sky?'0':'32';root.querySelector('#ms-cash').textContent=money(state.cash);root.querySelector('#ms-unread').textContent=state.read?'0 unread':'3 unread';root.querySelector('#ms-unread').parentElement.setAttribute('aria-label','Open inbox, '+(state.read?0:3)+' unread');root.querySelector('#ms-clock-state').textContent=state.speed?state.speed+'× preview':'Paused';root.querySelectorAll('[data-speed]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.speed)===state.speed)));root.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===(['properties'].includes(state.page)?'studios':['event','print'].includes(state.page)?'print':state.page))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});main.innerHTML=(pages[state.page]||officePage)();if(state.page==='print'){root.querySelector('#ms-printer').value=state.tier;updateQuote();}root.querySelectorAll('button,select,summary').forEach(e=>e.classList.add('cursor-interaction'));globalThis.lucide?.createIcons({attrs:{width:16,height:16}});}
function toast(message){const t=root.querySelector('#ms-toast');t.textContent=message;t.hidden=false;}
function go(page){state.page=page;state.side='';if(page==='print'||page==='event')state.title='lantern';root.querySelector('#ms-toast').hidden=true;render();persist();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page){go(b.dataset.page);return;}if(b.dataset.speed!==undefined){state.speed=Number(b.dataset.speed);render();persist();return;}const a=b.dataset.action;if(!a)return;
if(a==='submit-print'||a==='submit-reserve'){submitSample(a==='submit-print'?'ms-print-form':'ms-reserve-form');return;}
if(a==='inbox'){if(state.page==='office'){state.side=state.side==='inbox'?'':'inbox';render();}else go('inbox');}
else if(a==='series-side'){state.side=state.side==='series'?'':'series';render();}
else if(a==='close-side'){state.side='';render();}
else if(a==='inbox-page')go('inbox');else if(a==='sales'||a==='production'){go('series');root.querySelector(a==='sales'?'#ms-sales':'#ms-production').scrollIntoView({block:'nearest',behavior:'auto'});}
else if(a==='furnish')toast('Preview: this opens the existing furniture editor, retaining its Apply / Discard controls.');
else if(a==='property-preview')toast('Preview only: the game opens a furnished layout and full move quote before you commit. No money spent.');
else if(a==='terms')toast('Preview: the offer details page will show exact pay, rights and deadlines before Accept or Decline. No offer accepted.');
else if(a==='defer'){go('inbox');toast('Kept in inbox. The publisher offer still needs a decision.');}
else if(a==='mark-read'){state.read=true;render();toast('Routine messages marked read. The unresolved offer remains under Needs attention.');}
else if(pages[a])go(a);persist();});
root.addEventListener('change',e=>{const t=e.target;if(t.dataset.setting){state[t.dataset.setting]=t.value;settings();persist();}else if(t.id==='ms-title-choice'){state.title=t.value;if(state.page==='print'||state.page==='event')state.page='series';render();persist();}else if(t.id==='ms-printer'){state.tier=t.value;updateQuote();}});
root.addEventListener('input',e=>{if(e.target.id==='ms-quantity'){state.qty=e.target.valueAsNumber;updateQuote();}});
function submitSample(id){if(id==='ms-print-form'){const error=root.querySelector('#ms-print-error');if(!Number.isInteger(state.qty)||state.qty<1||state.qty>5000){error.textContent='Choose a whole number from 1 to 5,000.';return;}if(quote()>state.cash){error.textContent='Not enough available business funds. Reduce the quantity or choose another printer.';return;}const cost=quote(),count=state.qty;state.cash-=cost;state.pending+=count;go('series');toast(`Sample order placed: ${count} copies for ${money(cost)}. Stock stays at 32 until delivery.`);}if(id==='ms-reserve-form'){const n=root.querySelector('#ms-reserve-input').valueAsNumber;if(!Number.isInteger(n)||n<0||n>32){root.querySelector('#ms-reserve-error').textContent='Reserve between 0 and 32 delivered copies.';return;}state.reserved=n;render();toast(`Sample reservation updated: ${n} reserved, ${32-n} available to other buyers.`);}persist();}
root.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(e.target.matches('input,select,textarea')){e.target.blur();e.stopPropagation();return;}if(state.side){state.side='';render();}else if(state.page==='helper')go('inbox');});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{settings();persist();}});tweak.addSelect(state,'theme',{label:'Theme',options:['dark','light']});tweak.addSelect(state,'density',{label:'Layout density',options:['comfortable','compact']});tweak.addSelect(state,'motion',{label:'UI motion',options:['subtle','reduced']});}
})();
</script>
</div>
